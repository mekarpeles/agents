[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "Register and run named Claude Code agents with native socket messaging, no daemon."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ag = "agents.cli:main"
agents = "agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["types/*/AGENTS.md"]
