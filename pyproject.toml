[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agents"
version = "0.1.0"
description = "Register and run named Claude Code agents with native socket messaging, no daemon."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
# Only `agents` is installed by the package; the short `ag` alias is created
# on demand by `agents configure` (and the installer), but only when the name
# isn't already taken — `ag` is commonly the_silver_searcher.
agents = "agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agents*"]

[tool.setuptools.package-data]
agents = ["types/*/AGENTS.md"]
